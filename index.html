<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="./Img/logo.png">
  <title>منوی مستر سعید | آش • حلیم • غذای روز</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- هدر سایت -->
  <header class="header">
    <div class="logo">
      <img src="./Img/logo.png" alt="لوگوی مستر سعید" class="brand-logo" onerror="this.style.display='none'">
      <div>
        <h1>مستر سعید</h1>
        <p>آش • حلیم • غذای روز</p>
      </div>
    </div>
    <a href="tel:09380523929" class="btn-call-header">📞 تماس</a>
  </header>

  <!-- بخش معرفی و جستجو -->
  <section class="intro">
    <h2>منوی قیمت غذاها</h2>
    <p class="subtitle">قیمت‌های روزانه و وزن‌های مختلف هر غذا</p>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="جستجوی غذا یا دسر...">
    </div>
  </section>

  <!-- تب‌های دسته‌بندی -->
  <nav class="categories" id="categoryTabs"></nav>

  <!-- لیست غذاها -->
  <main class="container">
    <div class="menu-list" id="menuList"></div>
    <p id="noResults" class="empty-msg hidden">موردی یافت نشد.</p>
  </main>

  <!-- اطلاعات شعبه و دکمه تماس تلفنی -->
  <section class="info-box">
    <div class="info-row">
      <span class="icon">📍</span>
      <span>چهارراه شاپور، پایین‌تر از آگاهی شاپور، پلاک ۲۳۲</span>
    </div>
    <div class="info-row">
      <span class="icon">🕐</span>
      <span>هر روز ۵ صبح تا ۲ بامداد</span>
    </div>
    <div class="info-actions">
      <a href="tel:09380523929" class="btn-call-single">
        📞 تماس تلفنی: ۰۹۳۸۰۵۲۳۹۲۹
      </a>
    </div>
  </section>

  <!-- فوتر -->
  <footer class="footer">
    <p>مستر سعید — آش • حلیم • غذای روز</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
